<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalDrop</title>
<link rel="stylesheet" href="styles.css">
<script>
  // errors that happen before the Python bridge is ready; core.js forwards them to the log later
  window.__errs = [];
  window.addEventListener('error', function (e) { window.__errs.push(e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  window.addEventListener('unhandledrejection', function (e) { window.__errs.push('unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
</script>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/htm.umd.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="i18n_en.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
